<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./blocks/index.css" />
    <link rel="stylesheet" href="./blocks/switch.css" />
    <title>#TicTacToe</title>
  </head>
  <body class="body">
    <header class="header">
      <h1 class="title">Just a TicTacToe</h1>
      <div class="theme-toggle__container">
        <input type="checkbox" id="theme-toggle" class="theme-toggle" />
      </div>
    </header>
    <main class="main">
      <section class="game">
        <div class="game__field">
          <div class="game__cell" data-cell></div>
          <div class="game__cell" data-cell></div>
          <div class="game__cell" data-cell></div>
          <div class="game__cell" data-cell></div>
          <div class="game__cell" data-cell></div>
          <div class="game__cell" data-cell></div>
          <div class="game__cell" data-cell></div>
          <div class="game__cell" data-cell></div>
          <div class="game__cell" data-cell></div>
        </div>
      </section>
      <p class="game-message"></p>
      <div class="btn__container">
        <button id="restartButton" class="restart-btn">Restart Game</button>
      </div>
      <div class="score-board">
        <p>Jugador (X): <span id="scoreX">0</span></p>
        <p>Máquina (O): <span id="scoreO">0</span></p>
        <p>Empates: <span id="scoreTies">0</span></p>
      </div>
    </main>
    <script src="./index.js" defer></script>
    <script src="./switch.js" defer></script>

    <footer class="footer">
      <p class="footer__text">© Creado por Julian Lopez</p>
      <a
        class="footer__link"
        href="https://github.com/DamagedSociety"
        target="_blank"
      >
        <img class="footer__icon" src="./images/github20.svg" alt="GitHub Icon"
      /></a>
    </footer>
  </body>
</html>
